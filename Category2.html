<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KLM Supermarket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
        }

        h1 {
            background-color: #4CAF50;
            color: white;
            padding: 15px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            width: 200px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 150px;
            border-radius: 10px;
        }

        .card h2 {
            margin-top: 15px;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>KLM Supermarket</h1>

    <div class="container">

        <!-- Fruits -->
        <div class="card">
            <img src="fruit image.png" alt="Fruits">
            <h2>Fruits</h2>
        </div>

        <!-- Vegetables -->
        <div class="card">
            <img src="vegetable image.png" alt="Vegetables">
            <h2>Vegetables</h2>
        </div>

        <!-- Dairy -->
        <div class="card">
            <img src="dairy image.png" alt="Dairy">
            <h2>Dairy</h2>
        </div>

    </div>

</body>
</html>
