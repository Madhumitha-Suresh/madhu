<!DOCTYPE html>
<html>
<head>
    <title>KLM Supermarket - Payment</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            margin-top: 50px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            text-align: center;
        }

        .payment-method {
            margin: 10px 0;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            margin-top: 15px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>KLM Supermarket Payment</h2>

    <!-- Order Summary -->
    <p><b>Total Amount:</b> ₹500</p>

    <!-- Payment Options -->
    <div class="payment-method">
        <input type="radio" name="payment" onclick="showOption('upi')"> UPI
    </div>

    <div class="payment-method">
        <input type="radio" name="payment" onclick="showOption('card')"> Debit/Credit Card
    </div>

    <div class="payment-method">
        <input type="radio" name="payment" onclick="showOption('netbanking')"> Net Banking
    </div>

    <!-- UPI Section -->
    <div id="upi" class="hidden">
        <label>Enter UPI ID:</label>
        <input type="text" placeholder="example@upi">
    </div>

    <!-- Card Section -->
    <div id="card" class="hidden">
        <label>Card Number:</label>
        <input type="text" placeholder="XXXX XXXX XXXX XXXX">

        <label>Expiry Date:</label>
        <input type="month">

        <label>CVV:</label>
        <input type="password" placeholder="123">
    </div>

    <!-- Net Banking Section -->
    <div id="netbanking" class="hidden">
        <label>Select Bank:</label>
        <select>
            <option>SBI</option>
            <option>HDFC</option>
            <option>ICICI</option>
            <option>Axis Bank</option>
        </select>
    </div>

    <button onclick="makePayment()">Pay Now</button>

    <p id="successMsg" style="color:green; text-align:center;"></p>
</div>

<script>
    function showOption(option) {
        document.getElementById('upi').style.display = 'none';
        document.getElementById('card').style.display = 'none';
        document.getElementById('netbanking').style.display = 'none';

        document.getElementById(option).style.display = 'block';
    }

    function makePayment() {
        document.getElementById("successMsg").innerHTML = "Payment Successful! 🛒 Thank you for shopping.";
    }
</script>

</body>
</html>
